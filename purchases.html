<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hardware Shop — Purchases</title><link rel="stylesheet" href="styles.css"><script src="barcode128.js"></script><script src="app.js" defer></script></head><body>
<aside class="sidebar"><a class="brand" href="index.html"><span class="brand-mark">H</span><span><span data-shop-name>Hardware Shop</span><small>SALES & STOCK</small></span></a><div class="nav-label">WORKSPACE</div><nav><a class="nav-item" href="index.html">Billing</a><a class="nav-item" href="stock.html">Stock</a><a class="nav-item" href="customers.html">Customers</a><a class="nav-item active" href="purchases.html">Purchases</a><a class="nav-item" href="reports.html">Reports</a><a class="nav-item" href="settings.html">Settings</a></nav></aside>
<main class="main"><header class="topbar"><div><span class="eyebrow"><span data-shop-context>HARDWARE SHOP</span> / INVENTORY</span><h1>Purchases</h1></div><span class="today" id="today"></span></header>
<section class="card settings-card"><h2>Receive stock</h2><div class="purchase-fields"><label>SUPPLIER<input id="purchase-supplier" placeholder="Supplier name"></label><label>DATE<input id="purchase-date" type="date"></label></div><div class="purchase-add"><select id="purchase-product" aria-label="Choose stock item"><option value="">Choose stock item…</option></select><input id="purchase-qty" type="number" min="1" step="1" placeholder="Qty" aria-label="Quantity"><input id="purchase-cost" type="number" min="0" step="0.01" placeholder="Unit cost ₹" aria-label="Unit cost"><button class="button button-dark" id="purchase-add-line">Add line</button></div><div class="table-wrap"><table class="history-table"><thead><tr><th>ITEM</th><th>QTY RECEIVED</th><th>UNIT COST</th><th>LINE TOTAL</th><th></th></tr></thead><tbody id="purchase-draft-rows"></tbody></table></div><div class="purchase-total">Purchase total: <strong id="purchase-total">₹0.00</strong></div><button class="button button-primary" id="purchase-save">Save purchase and receive stock</button></section>
<section class="card settings-card"><h2>Purchase history</h2><label class="search-box"><span>⌕</span><input id="purchase-search" placeholder="Search supplier, item, or date…" aria-label="Search purchases"></label><div class="table-wrap"><table class="history-table"><thead><tr><th>DATE</th><th>SUPPLIER</th><th>ITEMS</th><th>QUANTITY</th><th>TOTAL COST</th></tr></thead><tbody id="purchase-history-rows"></tbody></table></div><div id="purchase-empty" class="history-empty" hidden>No purchases recorded yet.</div></section></main><div class="toast" id="toast" role="status" aria-live="polite"></div></body></html>
